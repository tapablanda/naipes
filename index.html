<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>naipes.club</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    font-family: sans-serif;
    min-height: 100vh;
  }

  header {
    background: #fff;
    padding: 1.2rem 2.5rem 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #e8e8e8;
  }

  nav {
    display: flex;
    gap: 2rem;
    align-items: center;
  }

  nav a {
    display: inline-block;
    cursor: pointer;
    user-select: none;
    opacity: 0.28;
    transition: opacity 0.2s;
    text-decoration: none;
  }

  nav a img {
    display: block;
    height: 38px;
    width: auto;
  }

  nav a.active { opacity: 1; }
  nav a:hover:not(.active) { opacity: 0.55; }

  #stage {
    background: #000;
    min-height: calc(100vh - 70px);
    padding: 3rem 2rem 6rem;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0;
  }

  .deck-tile {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .deck-tile img {
    display: block;
    width: 100%;
    max-width: 200px;
    border-radius: 7px;
    opacity: 0.9;
    transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), opacity 0.15s;
    transform: var(--rot, rotate(0deg));
    user-select: none;
    -webkit-user-drag: none;
  }

  .deck-tile:hover img {
    opacity: 1;
    transform: var(--rot, rotate(0deg)) scale(1.05);
  }

  .deck-tile img.swap {
    animation: swapIn 0.2s ease;
  }

  @keyframes swapIn {
    from { opacity: 0; transform: var(--rot, rotate(0deg)) scale(0.95); }
    to   { opacity: 0.9; transform: var(--rot, rotate(0deg)) scale(1); }
  }

  .empty-msg {
    color: #333;
    font-size: 1.2rem;
    padding: 4rem;
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>

<header>
  <nav id="nav">
    <a class="active" data-filter="all"><img src="nav/all.png" alt="all"></a>
    <a data-filter="playing cards"><img src="nav/playing-cards.png" alt="playing cards"></a>
    <a data-filter="oracles"><img src="nav/oracles.png" alt="oracles"></a>
    <a data-filter="other"><img src="nav/other.png" alt="other"></a>
  </nav>
</header>

<div id="stage">
  <div class="deck-grid" id="grid"></div>
  <div class="empty-msg" id="empty" style="display:none;">nothing here yet</div>
</div>

<script>
const decks = [
  {
    category: "playing cards",
    images: [
      "images/01_jumbo/jumbo001.png",
      "images/01_jumbo/jumbo002.png",
      "images/01_jumbo/jumbo003.png",
      "images/01_jumbo/jumbo004.png",
      "images/01_jumbo/jumbo005.png",
      "images/01_jumbo/jumbo006.png",
      "images/01_jumbo/jumbo007.png",
      "images/01_jumbo/jumbo008.png",
      "images/01_jumbo/jumbo009.png",
      "images/01_jumbo/jumbo010.png",
      "images/01_jumbo/jumbo011.png",
    ]
  },
  {
    category: "playing cards",
    images: [
      "images/02_panter/panter000.png",
      "images/02_panter/panter002.png",
      "images/02_panter/panter0003.png",
      "images/02_panter/panter005.png",
      "images/02_panter/panter006.png",
      "images/02_panter/panter007.png",
      "images/02_panter/panter008.png",
      "images/02_panter/panter009.png",
    ]
  },
  {
    category: "playing cards",
    images: [
      "images/03_vanity/vanity000.png",
      "images/03_vanity/vanity0000.png",
      "images/03_vanity/vanity00000.png",
      "images/03_vanity/vanity001.png",
      "images/03_vanity/vanity002.png",
      "images/03_vanity/vanity003.png",
      "images/03_vanity/vanity004.png",
      "images/03_vanity/vanity005.png",
      "images/03_vanity/vanity006.png",
      "images/03_vanity/vanity007.png",
      "images/03_vanity/vanity008.png",
      "images/03_vanity/vanity009.png",
    ]
  },
  {
    category: "playing cards",
    images: [
      "images/04_waterstones/waterstones0000.png",
      "images/04_waterstones/waterstones001.png",
      "images/04_waterstones/waterstones002.png",
      "images/04_waterstones/waterstones003.png",
      "images/04_waterstones/waterstones004.png",
      "images/04_waterstones/waterstones005.png",
      "images/04_waterstones/waterstones006.png",
    ]
  },
];

function randRot() {
  const deg = (Math.random() * 10 - 5).toFixed(2);
  return `rotate(${deg}deg)`;
}

function renderGrid(filter) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';

  const filtered = filter === 'all'
    ? decks
    : decks.filter(d => d.category === filter);

  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  filtered.forEach(deck => {
    const rot = randRot();
    let index = 0;

    const tile = document.createElement('div');
    tile.className = 'deck-tile';
    tile.style.setProperty('--rot', rot);

    const img = document.createElement('img');
    img.src = deck.images[0];
    img.alt = deck.category;
    img.loading = 'lazy';

    tile.addEventListener('click', () => {
      index = (index + 1) % deck.images.length;
      img.classList.remove('swap');
      void img.offsetWidth;
      img.src = deck.images[index];
      img.classList.add('swap');
    });

    tile.appendChild(img);
    grid.appendChild(tile);
  });
}

let currentFilter = 'all';

document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  document.querySelectorAll('#nav a').forEach(el => el.classList.remove('active'));
  a.classList.add('active');
  currentFilter = a.dataset.filter;
  renderGrid(currentFilter);
});

renderGrid('all');
</script>
</body>
</html>
