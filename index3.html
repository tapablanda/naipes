<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    font-family: sans-serif;
    min-height: 100vh;
  }

  header {
    background: #fff;
    padding: 1.2rem 2.5rem 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #e8e8e8;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 2rem;
    align-items: center;
  }

  nav a {
    display: inline-block;
    cursor: pointer;
    user-select: none;
    opacity: 0.28;
    transition: opacity 0.2s;
    text-decoration: none;
  }

  nav a img {
    display: block;
    height: 32px;
    width: auto;
  }

  nav a.active { opacity: 1; }
  nav a:hover:not(.active) { opacity: 0.55; }

  #stage {
    background: #000;
    min-height: calc(100vh - 70px);
    padding: 3rem 2rem 6rem;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0;
  }

  .deck-tile {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .deck-tile img {
    display: block;
    width: 100%;
    max-width: 200px;
    border-radius: 7px;
    opacity: 0.9;
    transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), opacity 0.15s;
    transform: var(--rot, rotate(0deg));
    user-select: none;
    -webkit-user-drag: none;
  }

  .deck-tile:hover img {
    opacity: 1;
    transform: var(--rot, rotate(0deg)) scale(1.05);
  }

  .empty-msg {
    color: #333;
    font-size: 1.2rem;
    padding: 4rem;
    text-align: center;
    width: 100%;
  }
</style>
</head>

function randRot() {
  const deg = (Math.random() * 10 - 5).toFixed(2);
  return `rotate(${deg}deg)`;
}

function renderGrid(filter) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';

  const filtered = filter === 'all'
    ? decks
    : decks.filter(d => d.category === filter);

  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  filtered.forEach(deck => {
    const rot = randRot();
    let index = 0;

    const tile = document.createElement('div');
    tile.className = 'deck-tile';
    tile.style.setProperty('--rot', rot);

    const img = document.createElement('img');
    img.src = deck.images[0];
    img.alt = deck.category;
    img.loading = 'lazy';

    tile.addEventListener('click', () => {
      index = (index + 1) % deck.images.length;
      img.src = deck.images[index];
    });

    tile.appendChild(img);
    grid.appendChild(tile);
  });
}

let currentFilter = 'all';

document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  document.querySelectorAll('#nav a').forEach(el => el.classList.remove('active'));
  a.classList.add('active');
  currentFilter = a.dataset.filter;
  renderGrid(currentFilter);
});

renderGrid('all');
